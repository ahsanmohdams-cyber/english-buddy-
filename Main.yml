
name: English Buddy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
            echo "build_mode=wrapper" >> "$GITHUB_OUTPUT"
          else
            wrapper=$(find . -maxdepth 4 -type f -name gradlew -print -quit)

            if [ -n "$wrapper" ]; then
              dir=$(dirname "$wrapper")
              echo "project_dir=$dir" >> "$GITHUB_OUTPUT"
              echo "build_mode=wrapper" >> "$GITHUB_OUTPUT"
            else
              settings=$(find . -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

              if [ -z "$settings" ]; then
                echo "::error::Android Gradle project not found."
                exit 1
              fi

              dir=$(dirname "$settings")
              echo "project_dir=$dir" >> "$GITHUB_OUTPUT"
              echo "build_mode=system" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Setup Gradle
        if: steps.project.outputs.build_mode == 'system'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Buddy-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
